<!DOCTYPE html>
<html lang="en">
<head>
  <title>Leave — Prithvi Realcon Transport</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Sora:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="common.js"></script>
</head>
<body>
<div class="shell">
  <div class="nav">
    <a href="dashboard.html">← Dashboard</a>
    <a href="#" id="logoutLink">Log out</a>
  </div>

  <div class="card">
    <div class="in">
      <h1>Apply for leave</h1>
      <p class="sub">Your request goes to admin for approval.</p>
      <div class="road"></div>

      <label for="ty">Leave type</label>
      <select id="ty">
        <option value="single_day">Single day</option>
        <option value="long_leave">Long leave</option>
      </select>

      <label for="sd">Start date</label>
      <input type="date" id="sd">

      <div id="edw" style="display:none">
        <label for="ed">End date</label>
        <input type="date" id="ed">
      </div>

      <label for="rs">Reason (optional)</label>
      <textarea id="rs" rows="2" placeholder="e.g. family function"></textarea>

      <button class="full accent" id="sub">Submit request</button>
      <div id="status" class="status"></div>
    </div>
  </div>

  <div class="card">
    <div class="in">
      <h2>My requests</h2>
      <div class="tw">
        <table>
          <thead><tr><th>Dates</th><th>Status</th><th></th></tr></thead>
          <tbody id="lb"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
let token = '';
const t = todayIST();
$('sd').min = $('ed').min = $('sd').value = $('ed').value = t;

$('ty').onchange = () => {
  const long = $('ty').value === 'long_leave';
  $('edw').style.display = long ? 'block' : 'none';
  if (!long) $('ed').value = $('sd').value;
};

$('sd').onchange = () => {
  if ($('ty').value === 'single_day') $('ed').value = $('sd').value;
  if ($('ed').value && $('ed').value < $('sd').value) $('ed').value = $('sd').value;
  $('ed').min = $('sd').value;
};

async function list() {
  const { data, error } = await sb.rpc('my_leaves', { p_token: token });
  if (error) {
    if (/not logged in/i.test(error.message)) {
      clearSession();
      location.href = 'index.html';
      return;
    }
    return msg(esc(error.message), 'error');
  }
  const rows = data || [];
  $('lb').innerHTML = rows.length
    ? rows
        .map((l) => {
          const canCancel = l.status === 'pending' || (l.status === 'approved' && l.end_date >= t);
          return (
            '<tr><td><strong>' + esc(fmtRange(l.start_date, l.end_date)) + '</strong>' +
            (l.reason ? '<br><span class="muted">' + esc(l.reason) + '</span>' : '') +
            '</td><td>' + pill(l.status) + '</td><td>' +
            (canCancel ? '<button class="sm bad" data-id="' + l.id + '">Cancel</button>' : '') +
            '</td></tr>'
          );
        })
        .join('')
    : '<tr><td colspan="3" class="muted">No requests yet</td></tr>';

  document.querySelectorAll('[data-id]').forEach((b) => {
    b.onclick = async () => {
      if (!confirm('Cancel this leave?')) return;
      setBusy(b, true);
      const { error } = await sb.rpc('cancel_leave', { p_token: token, p_id: b.dataset.id });
      setBusy(b, false);
      msg(error ? esc(error.message) : 'Leave cancelled.', error ? 'error' : 'success');
      list();
    };
  });
}

$('sub').onclick = async () => {
  const single = $('ty').value === 'single_day';
  const s = $('sd').value;
  const e = single ? s : $('ed').value;
  if (!s || !e) return msg('Select dates.', 'error');
  if (e < s) return msg('End date cannot be before start date.', 'error');
  setBusy($('sub'), true);
  const { error } = await sb.rpc('request_leave', {
    p_token: token, p_type: $('ty').value, p_start: s, p_end: e, p_reason: $('rs').value,
  });
  setBusy($('sub'), false);
  if (error) return msg(esc(error.message), 'error');
  $('rs').value = '';
  msg('Request submitted. Waiting for admin approval.', 'success');
  list();
};

$('logoutLink').onclick = (e) => {
  e.preventDefault();
  logout();
};

(async () => {
  token = await need();
  if (!token) return;
  list();
})();
</script>
</body>
</html>
