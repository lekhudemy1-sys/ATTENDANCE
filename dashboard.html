<!DOCTYPE html>
<html lang="en">
<head>
  <title>Dashboard — Prithvi Realcon Transport</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Sora:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="common.js"></script>
</head>
<body>
<div class="shell">
  <div class="card">
    <div class="in">
      <div class="nav">
        <div data-brand style="margin:0"></div>
        <a href="#" id="logoutLink">Log out</a>
      </div>

      <div class="hello">
        <div class="avatar" id="av">·</div>
        <div>
          <div class="muted" id="gr">Hello</div>
          <h1 id="nm" style="margin:0;font-size:22px">…</h1>
        </div>
      </div>

      <div class="road"></div>

      <div class="clock" id="clk">--:--:--</div>
      <p class="muted center" id="dt"></p>

      <div class="today"><span id="st" class="pill">…</span></div>
      <p class="muted center" id="tm" style="margin-top:8px"></p>
      <p class="worked center" id="wk"></p>

      <button class="orb" id="inBtn" style="display:none">Sign In</button>
      <button class="orb alt" id="outBtn" style="display:none">Sign Out</button>
      <p class="muted center" style="margin-top:14px">Location must be on. You must be at the office to Sign In and Sign Out.</p>
      <div id="status" class="status"></div>
    </div>
  </div>
  <p class="center"><a href="leave.html">Apply for leave →</a></p>
</div>
<script>
let off = 0;
let marking = false;
let token = '';
let signIn = '';
let signOut = '';
const toSec = (t) => { const [a, b, c] = String(t).split(':').map(Number); return a * 3600 + b * 60 + (c || 0); };
const hm = (s) => Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm';

const LABEL = { none: 'Not marked', signed_in: 'Signed in', signed_out: 'Signed out', leave: 'On leave' };

function tick() {
  const n = new Date(Date.now() + off);
  $('clk').textContent = n.toLocaleTimeString('en-GB', { timeZone: 'Asia/Kolkata' });
  $('dt').textContent = n.toLocaleDateString('en-IN', {
    timeZone: 'Asia/Kolkata', weekday: 'long', day: 'numeric', month: 'long',
  });
  const h = +n.toLocaleTimeString('en-GB', { timeZone: 'Asia/Kolkata', hour: '2-digit', hour12: false });
  $('gr').textContent = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';

  if (signIn && signOut) {
    $('wk').textContent = 'Total hours · ' + hm(Math.max(0, toSec(signOut) - toSec(signIn)));
  } else if (signIn) {
    const s = toSec(n.toLocaleTimeString('en-GB', { timeZone: 'Asia/Kolkata' })) - toSec(signIn);
    $('wk').textContent = s > 0 ? 'Working · ' + hm(s) : '';
  } else $('wk').textContent = '';
}

async function load() {
  const { data, error } = await sb.rpc('day_info', { p_token: token });
  if (error) {
    if (/not logged in/i.test(error.message)) {
      clearSession();
      location.href = 'index.html';
      return;
    }
    msg(esc(error.message), 'error');
    return;
  }
  off = new Date(data.now).getTime() - Date.now();
  signIn = data.sign_in || '';
  signOut = data.sign_out || '';
  $('st').className = 'pill ' + data.status;
  $('st').textContent = LABEL[data.status] || data.status;
  $('tm').textContent = [
    data.sign_in && 'In ' + data.sign_in,
    data.sign_out && 'Out ' + data.sign_out,
  ].filter(Boolean).join('  ·  ');
  $('inBtn').style.display = data.status === 'none' ? 'block' : 'none';
  $('outBtn').style.display = data.status === 'signed_in' ? 'block' : 'none';
  tick();
  if (data.status === 'leave') {
    msg('You are on approved leave today. Cancel your leave before marking attendance.', 'error');
  }
}

async function mark(kind) {
  if (marking) return;
  marking = true;
  const btn = kind === 'sign_in' ? $('inBtn') : $('outBtn');
  setBusy(btn, true);
  const release = () => {
    marking = false;
    setBusy(btn, false);
  };

  if (!navigator.geolocation) {
    release();
    return msg('Location is required, but this device does not support it.', 'error');
  }

  msg('Checking your location…', 'info');
  navigator.geolocation.getCurrentPosition(
    async (p) => {
      try {
        const { data, error } = await sb.rpc('mark_attendance', {
          p_token: token,
          p_kind: kind,
          p_lat: p.coords.latitude,
          p_lng: p.coords.longitude,
          p_device: getDeviceId(),
        });
        await load();
        msg(esc(error ? error.message : data), error ? 'error' : 'success');
      } finally {
        release();
      }
    },
    () => {
      release();
      msg('Location access denied. Location is required to Sign In and Sign Out. Please allow location and try again.', 'error');
    },
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
  );
}

(async () => {
  token = await need();
  if (!token) return;

  const { data: me, error: meErr } = await sb.rpc('emp_me', { p_token: token });
  if (meErr || !me) {
    clearSession();
    location.href = 'index.html';
    return;
  }
  $('nm').textContent = me.name;
  $('av').textContent = initials(me.name);

  await load();
  setInterval(tick, 1000);
  // refresh status every minute (picks up the 23:59 auto sign-out)
  setInterval(load, 60 * 1000);
  setInterval(async () => {
    const { data } = await sb.rpc('day_info', { p_token: token });
    if (data?.now) off = new Date(data.now).getTime() - Date.now();
  }, 5 * 60 * 1000);

  $('inBtn').onclick = () => mark('sign_in');
  $('outBtn').onclick = () => mark('sign_out');
  $('logoutLink').onclick = (e) => {
    e.preventDefault();
    logout();
  };
})();
</script>
</body>
</html>
